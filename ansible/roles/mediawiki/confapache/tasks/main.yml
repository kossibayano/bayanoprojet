---
# 0. Ajout du compte user-ansible dans le groupe www-data
- name: "add user-ansible to www-data group"
  ansible.builtin.user:
    name: "user-ansible"
    groups: "www-data"
    append: yes

# 1. Création du répertoire pour l'installation des fichiers Mediawiki
- name: "mediawiki directory"
  ansible.builtin.file:
    path: "{{mediawiki_directory}}"
    owner: "www-data"
    group: "www-data"
    mode: '0775'
    state: directory

# 2a. Téléchargement préalable de l'archive Mediawiki sur le serveur cible
- name: "download mediawiki archive"
  ansible.builtin.get_url:
    url: "{{mediawiki_archive_url}}"
    dest: "/tmp/mediawiki.tar.gz"
    mode: '0644'

# 2b. Décompression de l'archive avec --strip-components=1
- name: "uncompress mediawiki archive"
  ansible.builtin.unarchive:
    src: "/tmp/mediawiki.tar.gz"
    dest: "{{mediawiki_directory}}"
    owner: "www-data"
    group: "www-data"
    remote_src: yes
    extra_opts:
      - --strip-components=1

# 3. Droits d'écriture pour le groupe www-data sur l'arborescence
- name: "add write permission for www-data group"
  ansible.builtin.file:
    path: "{{mediawiki_directory}}"
    owner: "www-data"
    group: "www-data"
    mode: 'u=rwX,g=rwX,o=rX'
    recurse: yes

# 4. Configuration de MediaWiki via install.php
- name: "mediawiki configuration"
  become: yes
  become_user: "user-ansible"
  ansible.builtin.command:
    cmd: >
      php install.php --scriptpath /{{mediawiki_name}}
      --dbtype mysql
      --dbuser {{mediawiki_db_user}}
      --dbpass {{mediawiki_db_password}}
      --dbname {{mediawiki_db_name}}
      --pass {{mediawiki_admin_password}}
      --dbserver {{mediawiki_db_host}}
      --server http://http1
      "{{mediawiki_title}}" {{mediawiki_admin_user}}
  args:
    creates: "{{mediawiki_directory}}/LocalSettings.php"
    chdir: "{{mediawiki_maintenance_directory}}"

# 5. Mise à jour de la base de données MediaWiki
- name: "mediawiki db update"
  become: yes
  become_user: "user-ansible"
  ansible.builtin.command:
    cmd: php update.php --quick
  args:
    chdir: "{{mediawiki_maintenance_directory}}"
  register: resultat
  changed_when: "'...done.' in resultat.stdout"
